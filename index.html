<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>滑冰賽事評分與分析入口網 (Scoring & Analysis Portal)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; margin: 0; height: 100vh; overflow: hidden; }
        .hidden-view { display: none !important; }
        .nav-item { cursor: pointer; transition: all 0.2s; }
        .nav-item-active { background-color: #eff6ff; color: #1d4ed8; border-right: 4px solid #2563eb; font-weight: bold; }
        .nav-item:hover:not(.nav-item-active) { background-color: #f8fafc; }
        
        #sidebar {
            transition: width 0.3s ease, padding 0.3s ease, opacity 0.3s ease;
            overflow-x: hidden;
            white-space: nowrap;
        }
        .sidebar-collapsed {
            width: 0 !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
            border: none !important;
            opacity: 0;
        }

        /* 搜尋下拉選單的卷軸美化 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <!-- 登入頁面 -->
    <div id="view-login" class="h-full w-full flex items-center justify-center bg-slate-900">
        <div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md">
            <div class="text-center mb-8">
                <div class="text-5xl mb-4">⛸️</div>
                <h1 class="text-2xl font-black text-slate-800">賽事評分與分析系統</h1>
                <p class="text-sm text-slate-500 mt-2">請輸入管理員密碼以進入系統</p>
            </div>
            <input type="password" id="login-password" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 mb-6 text-center text-lg" placeholder="請輸入密碼" onkeydown="if(event.key === 'Enter') handleLogin()">
            <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition-colors text-lg">登入系統 (Login)</button>
            <div id="login-error" class="text-red-500 text-sm font-bold text-center mt-4 hidden-view">❌ 密碼錯誤，請重試！</div>
        </div>
    </div>

    <!-- 主選單 -->
    <div id="view-main-menu" class="h-full w-full flex flex-col items-center justify-center hidden-view relative">
        <button onclick="handleLogout()" class="absolute top-6 right-6 text-slate-500 hover:text-slate-800 font-bold flex items-center gap-2"><span>🚪</span> 登出系統</button>
        <h2 class="text-4xl font-black text-slate-800 mb-12 tracking-wider">主選單 (MAIN MENU)</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl w-full px-6">
            <button onclick="goToScoring()" class="group bg-white p-8 rounded-3xl shadow-xl hover:shadow-2xl border-2 border-transparent hover:border-blue-500 transition-all text-left flex flex-col items-center text-center hover:-translate-y-2">
                <div class="w-24 h-24 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-5xl mb-6 group-hover:scale-110 transition-transform">📱</div>
                <h3 class="text-2xl font-bold text-slate-800 mb-2">評分系統 (Scoring)</h3>
                <p class="text-slate-500">開啟平板專用評分介面，輸入要素與 PCS 分數。</p>
            </button>
            <button onclick="showDashboard()" class="group bg-white p-8 rounded-3xl shadow-xl hover:shadow-2xl border-2 border-transparent hover:border-indigo-500 transition-all text-left flex flex-col items-center text-center hover:-translate-y-2">
                <div class="w-24 h-24 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-5xl mb-6 group-hover:scale-110 transition-transform">📊</div>
                <h3 class="text-2xl font-bold text-slate-800 mb-2">後台系統 (Portal)</h3>
                <p class="text-slate-500">進入後台管理，包含審核、檢閱與異常標記分析。</p>
            </button>
        </div>
    </div>

    <!-- 後台儀表板 -->
    <div id="view-dashboard" class="h-full w-full flex flex-col hidden-view">
        <div class="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-4 shrink-0 shadow-sm z-10">
            <div class="flex items-center gap-3">
                <button onclick="showMainMenu()" class="text-slate-500 hover:text-blue-600 bg-slate-100 hover:bg-blue-50 px-3 py-1.5 rounded-md font-bold text-sm transition-colors flex items-center gap-1"><span>◀</span> 返回主選單</button>
                <div class="w-px h-6 bg-slate-300 mx-2"></div>
                <button onclick="toggleSidebar()" class="text-slate-500 hover:text-blue-600 p-1 rounded focus:outline-none flex items-center transition-colors mr-1">
                    <span class="text-2xl leading-none">☰</span>
                </button>
                <h2 class="font-black text-slate-700 text-lg tracking-wide">ADMIN PORTAL</h2>
            </div>
            <div class="text-sm font-bold text-slate-500">Administrator</div>
        </div>

        <div class="flex-1 flex overflow-hidden">
            <!-- 左側邊欄 -->
            <div id="sidebar" class="w-72 bg-white border-r border-slate-200 flex flex-col py-4 shrink-0 overflow-y-auto">
                
                <!-- 【新增功能】全局賽事搜尋下拉選單 -->
                <div class="px-6 mb-6 relative" id="global-comp-container">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Global Event Select</label>
                    <div class="relative">
                        <input type="text" id="global-comp-search" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 font-bold text-slate-700 transition-all shadow-sm" placeholder="🔍 搜尋或選擇賽事..." onfocus="showCompDropdown()" oninput="filterComps()">
                        
                        <div id="global-comp-dropdown" class="absolute z-50 w-full bg-white border border-slate-200 rounded-lg shadow-xl mt-1 hidden max-h-60 overflow-y-auto custom-scrollbar">
                            <div class="p-4 text-center text-sm text-slate-400">資料讀取中...</div>
                        </div>
                    </div>
                </div>

                <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-6 mb-2">一、 資料與審核</div>
                <div class="nav-item nav-item-active px-6 py-3 text-slate-600 flex items-center gap-3" onclick="loadIframe('notate_records.html', this)"><span class="text-xl">✍️</span> <span>Notate (技術台)</span></div>
                <div class="nav-item px-6 py-3 text-slate-600 flex items-center gap-3" onclick="loadIframe('view_records_page.html', this)"><span class="text-xl">📄</span> <span>View (歷史檢閱)</span></div>

                <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-6 mt-6 mb-2">二、 分析與檢討</div>
                <div class="nav-item px-6 py-3 text-slate-600 flex items-center gap-3" onclick="loadIframe('flagged_notes.html', this)"><span class="text-xl">🚨</span> <span>Flagged Notes</span></div>
                <!-- 補上剛剛新增的 PCS Notes -->
                <div class="nav-item px-6 py-3 text-slate-600 flex items-center gap-3" onclick="loadIframe('pcs_notes.html', this)"><span class="text-xl">💡</span> <span>PCS Notes</span></div>

                <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-6 mt-6 mb-2">三、 輸出與報表</div>
                <div class="nav-item px-6 py-3 text-slate-600 flex items-center gap-3" onclick="loadIframe('print_report.html', this)"><span class="text-xl">🖨️</span> <span>Print (產出報表)</span></div>
            </div>

            <!-- 右側內容區 -->
            <div class="flex-1 bg-slate-100 relative">
                <!-- 載入成功時自動觸發廣播機制 -->
                <iframe id="content-frame" src="notate_records.html" class="w-full h-full border-0" onload="broadcastComp()"></iframe>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        // 新增引入 Firestore 功能
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcTYwmWN6W9gEmnvO2QyS1y2tCgDUUAgU",
            authDomain: "project-6981083948742415857.firebaseapp.com",
            projectId: "project-6981083948742415857",
            storageBucket: "project-6981083948742415857.firebasestorage.app",
            messagingSenderId: "708190565768",
            appId: "1:708190565768:web:00658fdeff9cf79341763d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app); // 初始化資料庫

        const viewLogin = document.getElementById('view-login');
        const viewMainMenu = document.getElementById('view-main-menu');
        const viewDashboard = document.getElementById('view-dashboard');
        const errorMsg = document.getElementById('login-error');

        // === 全局賽事連動變數 ===
        let globalComps = [];
        let currentGlobalComp = "";

        window.onload = () => { 
            if (sessionStorage.getItem('portal_logged_in') === 'true') {
                window.showMainMenu();
            }
        };

        window.handleLogin = async function() {
            const pwd = document.getElementById('login-password').value;
            try {
                await signInWithEmailAndPassword(auth, "admin@ivan.xiao", pwd);
                sessionStorage.setItem('portal_logged_in', 'true');
                errorMsg.classList.add('hidden-view');
                window.showMainMenu();
            } catch (error) {
                console.error("登入失敗:", error);
                errorMsg.classList.remove('hidden-view');
            }
        }

        window.handleLogout = function() {
            sessionStorage.removeItem('portal_logged_in');
            document.getElementById('login-password').value = '';
            viewMainMenu.classList.add('hidden-view');
            viewDashboard.classList.add('hidden-view');
            viewLogin.classList.remove('hidden-view');
        }

        window.showMainMenu = function() {
            viewLogin.classList.add('hidden-view');
            viewDashboard.classList.add('hidden-view');
            viewMainMenu.classList.remove('hidden-view');
        }

        window.showDashboard = function() {
            viewMainMenu.classList.add('hidden-view');
            viewDashboard.classList.remove('hidden-view');
            // 進入後台時，背景自動抓取賽事清單
            fetchGlobalComps();
        }

        window.goToScoring = function() { 
            window.open("https://skating-frontend2.vercel.app/", '_blank'); 
        }

        window.loadIframe = function(url, clickedElement) {
            document.getElementById('content-frame').src = url;
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('nav-item-active'));
            if(clickedElement) clickedElement.classList.add('nav-item-active');
        }

        window.toggleSidebar = function() {
            document.getElementById('sidebar').classList.toggle('sidebar-collapsed');
        }

        // ==========================================
        // 【核心邏輯】全局賽事搜尋與跨網頁通訊
        // ==========================================
        
        async function fetchGlobalComps() {
            try {
                const querySnapshot = await getDocs(collection(db, "scores"));
                const compSet = new Set();
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.competition) compSet.add(data.competition);
                });
                // 整理並排序賽事名稱
                globalComps = Array.from(compSet).sort();
                renderGlobalComps(globalComps);
            } catch (e) {
                console.error("無法取得賽事清單:", e);
                document.getElementById('global-comp-dropdown').innerHTML = '<div class="p-3 text-sm text-red-500">無法載入資料</div>';
            }
        }

        function renderGlobalComps(comps) {
            const dropdown = document.getElementById('global-comp-dropdown');
            dropdown.innerHTML = '';
            
            if (comps.length === 0) {
                dropdown.innerHTML = '<div class="p-3 text-sm text-slate-400 text-center">無相符賽事</div>';
                return;
            }
            
            comps.forEach(comp => {
                const div = document.createElement('div');
                div.className = 'px-4 py-2.5 text-sm text-slate-700 hover:bg-blue-50 hover:text-blue-700 cursor-pointer font-bold border-b border-slate-100 last:border-0 transition-colors';
                div.innerText = comp;
                div.onclick = () => { selectGlobalComp(comp); };
                dropdown.appendChild(div);
            });
        }

        window.filterComps = function() {
            const text = document.getElementById('global-comp-search').value.toLowerCase();
            const filtered = globalComps.filter(c => c.toLowerCase().includes(text));
            renderGlobalComps(filtered);
            document.getElementById('global-comp-dropdown').classList.remove('hidden');
        }

        window.showCompDropdown = function() {
            document.getElementById('global-comp-dropdown').classList.remove('hidden');
            window.filterComps(); 
        }

        // 當使用者選定賽事時
        window.selectGlobalComp = function(comp) {
            currentGlobalComp = comp;
            const searchInput = document.getElementById('global-comp-search');
            searchInput.value = comp;
            searchInput.blur();
            document.getElementById('global-comp-dropdown').classList.add('hidden');
            
            // 執行廣播
            window.broadcastComp();
        }

        // 發送 postMessage 給 iframe
        window.broadcastComp = function() {
            if (!currentGlobalComp) return;
            const iframe = document.getElementById('content-frame');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({ 
                    type: 'GLOBAL_COMP_SELECTED', 
                    comp: currentGlobalComp 
                }, '*');
            }
        }

        // 點擊外部隱藏下拉選單
        document.addEventListener('click', (e) => {
            const container = document.getElementById('global-comp-container');
            if (container && !container.contains(e.target)) {
                document.getElementById('global-comp-dropdown').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
