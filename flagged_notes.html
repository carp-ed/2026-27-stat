<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Flagged 動作檢討與註記 (Flagged Notes)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .note-input { width: 100%; resize: vertical; min-height: 40px; }
  </style>
</head>
<body class="p-6 h-screen flex flex-col box-border">

  <h1 class="text-3xl font-bold text-center text-red-800 mb-6 flex items-center justify-center gap-3 shrink-0">
      <span class="text-4xl">🚨</span> Flagged Review & Notes
  </h1>

  <!-- 瘦身：移除 grid 佈局，直接滿版滿寬 -->
  <div class="flex-1 overflow-hidden w-full relative flex flex-col">
    
    <!-- 頂部工具列 -->
    <div id="toolbar-banner" class="bg-white p-4 rounded-xl shadow flex justify-between items-center z-20 mb-6 shrink-0">
        <div class="flex items-center gap-4">
            <h2 id="current-comp-title" class="text-xl font-black text-slate-800 tracking-wide">👆 請從左上方選擇賽事</h2>
            <button onclick="openStatsModal()" class="text-xs bg-blue-50 text-blue-700 px-3 py-1.5 rounded-md hover:bg-blue-100 font-bold border border-blue-200 transition-colors flex items-center gap-1 shadow-sm">
                <span>📊</span> OAC 異常比例
            </button>
        </div>
        <div class="flex gap-3">
            <button onclick="loadFlaggedData()" class="text-sm bg-slate-100 text-slate-600 px-4 py-2 rounded-lg hover:bg-slate-200 font-bold transition-colors">⟳ 刷新資料</button>
            <button id="btn-add-manual" onclick="openManualModal()" class="hidden bg-white text-slate-600 hover:bg-slate-50 px-4 py-2 rounded-lg font-bold shadow-sm border border-slate-300 transition-colors flex items-center gap-2">
                <span class="text-lg leading-none">+</span> 自訂疑慮項目
            </button>
            <button onclick="saveAllNotes()" class="bg-red-600 text-white hover:bg-red-700 px-6 py-2 rounded-lg font-bold shadow-lg transition-transform active:scale-95 flex items-center gap-2">
                <span>💾</span> 儲存註解
            </button>
        </div>
    </div>

    <!-- 檢討列表區塊 -->
    <div class="flex-1 overflow-y-auto hide-scrollbar pb-10 w-full pr-2">
        <div id="flagged-list" class="flex flex-col gap-4">
            <div class="bg-white p-8 rounded-xl shadow border border-slate-200 text-center text-slate-500 font-medium text-lg max-w-2xl mx-auto mt-10">
                等待接收賽事指令中...
            </div>
        </div>
    </div>
  </div>

  <!-- OAC 統計報表彈窗 -->
  <div id="stats-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center backdrop-blur-sm">
      <div class="bg-white rounded-xl shadow-2xl max-w-5xl w-full max-h-[80vh] flex flex-col overflow-hidden">
          <div class="p-6 border-b border-slate-200 flex justify-between items-center bg-slate-50">
              <h2 class="text-2xl font-black text-slate-800">OAC 異常比例分析報表</h2>
              <button onclick="document.getElementById('stats-modal').classList.add('hidden')" class="text-slate-400 hover:text-red-500 font-bold text-xl">✕</button>
          </div>
          <div class="p-6 overflow-y-auto">
              <p class="text-sm text-slate-500 mb-4 font-medium">※ 根據 ISU Rule 5.5：容許誤差為 10 人內 1 個，11-20 人 2 個，依此類推，最高 5 個。<br>※ 您可以利用「Lack of TP Info」核取方塊，將因視角或缺乏官方資訊導致的合理偏差扣除，算出最終的「實際列計數」。</p>
              <table class="w-full text-center border-collapse">
                  <thead>
                      <tr class="bg-slate-200 text-slate-700 text-sm">
                          <th class="p-3 border text-left">賽事名稱 (Competition)</th>
                          <th class="p-3 border">選手數</th>
                          <th class="p-3 border">系統 Flag 總數</th>
                          <th class="p-3 border text-amber-700 bg-amber-50">Lack of Info (免責)</th>
                          <th class="p-3 border text-red-700 font-black">實際列計數</th>
                          <th class="p-3 border text-blue-700">OAC 容許數</th>
                          <th class="p-3 border">OAC 狀態</th>
                      </tr>
                  </thead>
                  <tbody id="stats-tbody"></tbody>
              </table>
          </div>
      </div>
  </div>

  <!-- 手動釘選項目彈窗 -->
  <div id="manual-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center backdrop-blur-sm">
      <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
          <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-red-50">
              <h2 class="text-lg font-black text-red-800">新增自訂疑慮項目</h2>
              <button onclick="closeManualModal()" class="text-slate-400 hover:text-red-500 font-bold text-xl">✕</button>
          </div>
          <div class="p-6 flex flex-col gap-4">
              <div class="text-sm font-bold text-slate-500 bg-slate-100 p-2 rounded text-center border border-slate-200" id="manual-comp-display"></div>
              <div>
                  <label class="block text-xs font-bold text-slate-500 mb-1">1. 選擇選手</label>
                  <select id="manual-skater-select" class="w-full p-2 border rounded bg-white outline-none focus:border-red-400" onchange="updateManualItemSelect()"></select>
              </div>
              <div>
                  <label class="block text-xs font-bold text-slate-500 mb-1">2. 選擇要釘選的動作/項目</label>
                  <select id="manual-item-select" class="w-full p-2 border rounded bg-white outline-none focus:border-red-400"></select>
              </div>
              
              <div>
                  <label class="block text-xs font-bold text-slate-500 mb-1">3. 標記類型</label>
                  <div class="flex gap-4 mt-1">
                      <label class="flex-1 flex items-center justify-center gap-2 cursor-pointer bg-red-50 hover:bg-red-100 px-3 py-3 rounded-lg border border-red-200 transition-colors">
                          <input type="radio" name="manual_type" value="flag" checked class="text-red-600 focus:ring-red-500 w-4 h-4 cursor-pointer">
                          <span class="text-sm font-bold text-red-800">🚨 Flag (異常)</span>
                      </label>
                      <label class="flex-1 flex items-center justify-center gap-2 cursor-pointer bg-blue-50 hover:bg-blue-100 px-3 py-3 rounded-lg border border-blue-200 transition-colors">
                          <input type="radio" name="manual_type" value="note" class="text-blue-600 focus:ring-blue-500 w-4 h-4 cursor-pointer">
                          <span class="text-sm font-bold text-blue-800">📝 Note (筆記)</span>
                      </label>
                  </div>
              </div>

              <button onclick="addManualFlag()" class="mt-4 w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg shadow-md transition-colors">📌 新增至列表</button>
          </div>
      </div>
  </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcTYwmWN6W9gEmnvO2QyS1y2tCgDUUAgU",
      authDomain: "project-6981083948742415857.firebaseapp.com",
      projectId: "project-6981083948742415857",
      storageBucket: "project-6981083948742415857.firebasestorage.app",
      messagingSenderId: "708190565768",
      appId: "1:708190565768:web:00658fdeff9cf79341763d",
      measurementId: "G-MHC2PZ27D8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let globalSkaterUpdates = {}; 
    let globalDataByComp = {};
    let globalStats = {};
    let currentActiveComp = null;
    let rawSkatersData = [];
    
    // 廣播時差處理變數
    let isDataLoaded = false;
    let pendingComp = null;

    function calcStats(numArray) {
        if (!numArray || numArray.length === 0) return { mean: '' };
        const sorted = [...numArray].sort((a, b) => a - b);
        const mean = (sorted.reduce((a, b) => a + b, 0) / sorted.length);
        return { mean: mean.toFixed(2) };
    }

    function parseEvString(str) {
        if(!str) return [];
        return str.trim().split(/[\s,]+/).map(n => parseFloat(n)).filter(n => !isNaN(n));
    }

    function getHighlightedDiff(origStr, currStr) {
        if (!origStr) return currStr;
        if (origStr === currStr) return currStr;
        if (currStr.startsWith(origStr)) {
            return `${origStr}<span class="text-red-600 font-bold">${currStr.substring(origStr.length)}</span>`;
        }
        return `<span class="text-red-600 font-bold">${currStr}</span>`;
    }

    window.handleNoteChange = function(skaterId, key, value) {
        globalSkaterUpdates[skaterId].flag_notes[key] = value;
        globalSkaterUpdates[skaterId].isModified = true;
    }

    window.handleLackInfoChange = function(skaterId, key, isChecked) {
        const arr = globalSkaterUpdates[skaterId].lack_info_flags;
        if (isChecked) {
            if (!arr.includes(key)) arr.push(key);
        } else {
            const index = arr.indexOf(key);
            if (index > -1) arr.splice(index, 1);
        }
        globalSkaterUpdates[skaterId].isModified = true;
        recalcStatsLocal();
    }

    // 【新增】監聽來自 index.html 的跨網頁廣播
    window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'GLOBAL_COMP_SELECTED') {
            const selectedComp = event.data.comp;
            if (isDataLoaded) {
                selectComp(selectedComp);
            } else {
                pendingComp = selectedComp;
                document.getElementById('current-comp-title').innerText = "⏳ 載入資料中...";
            }
        }
    });

    async function loadFlaggedData() {
        document.getElementById('flagged-list').innerHTML = '<div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center text-slate-400">正在分析分數與讀取自訂項目...</div>';
        
        globalSkaterUpdates = {};
        rawSkatersData = [];
        isDataLoaded = false;

        try {
            const querySnapshot = await getDocs(collection(db, "scores"));
            const flaggedItemsByComp = {}; 
            globalStats = {}; 

            querySnapshot.forEach((docSnap) => {
                const sData = docSnap.data();
                const skaterId = docSnap.id;
                sData.id = skaterId;
                rawSkatersData.push(sData);

                globalSkaterUpdates[skaterId] = {
                    flag_notes: sData.flag_notes || {},
                    lack_info_flags: sData.lack_info_flags || [],
                    isModified: false
                };

                const comp = sData.competition || "未命名賽事";
                const stn = sData.stn || "-";
                
                if (!flaggedItemsByComp[comp]) flaggedItemsByComp[comp] = [];
                if (!globalStats[comp]) globalStats[comp] = { skaters: 0, totalSystemFlags: 0, lackInfoCount: 0 };
                
                globalStats[comp].skaters++;

                const offStats = sData.official_stats || {};
                const origElements = sData.original_elements || [];
                const flagNotes = sData.flag_notes || {}; 
                const manualFlags = sData.manual_flags || []; 
                const manualNotes = sData.manual_notes || []; 
                const lackInfoFlags = sData.lack_info_flags || [];

                (sData.elements || []).forEach((el, idx) => {
                    if (!el.name || el.name.trim() === '') return;
                    const noteKey = `elem_${idx}`;
                    
                    const isManualFlag = manualFlags.includes(noteKey);
                    const isManualNote = manualNotes.includes(noteKey);
                    const isLackInfo = lackInfoFlags.includes(noteKey);
                    
                    const myEv = el.goe !== null ? parseFloat(el.goe) : 0;
                    const parsedOff = parseEvString((offStats.elements && offStats.elements[idx]) ? offStats.elements[idx] : '');
                    const st = calcStats(parsedOff);

                    let isFlagged = false;
                    let diffVal = 0;

                    if (st.mean !== '') {
                        diffVal = (myEv - parseFloat(st.mean)).toFixed(2);
                        if (Math.abs(diffVal) > 2.0) isFlagged = true;
                    }

                    if (isFlagged || isManualFlag || isManualNote) {
                        if (isFlagged) {
                            globalStats[comp].totalSystemFlags++;
                            if (isLackInfo) globalStats[comp].lackInfoCount++;
                        }
                        
                        flaggedItemsByComp[comp].push({
                            skaterId: skaterId,
                            skaterLabel: `#${stn} ${sData.skater}`,
                            type: 'TES', id: el.id || (idx + 1),
                            nameHtml: getHighlightedDiff(origElements[idx] ? origElements[idx].name : el.name, el.name),
                            myEv: myEv, offMean: st.mean || '-',
                            diff: st.mean !== '' ? (diffVal > 0 ? `+${diffVal}` : diffVal) : '-',
                            noteKey: noteKey,
                            existingNote: flagNotes[noteKey] || '',
                            isSystem: isFlagged,
                            isManualFlag: isManualFlag,
                            isManualNote: isManualNote,
                            isLackInfo: isLackInfo
                        });
                    }
                });

                const keys = ['composition', 'presentation', 'skatingSkills'];
                let myTotal = 0, offTotal = 0;
                let isOffPcsValid = false;

                keys.forEach(key => {
                    myTotal += parseFloat((sData.pcs || {})[key] || 0);
                    const st = calcStats(parseEvString((offStats.pcs && offStats.pcs[key]) ? offStats.pcs[key] : ''));
                    if (st.mean !== '') { offTotal += parseFloat(st.mean); isOffPcsValid = true; }
                });

                const pcsNoteKey = 'pcs_total';
                const isPcsManualFlag = manualFlags.includes(pcsNoteKey);
                const isPcsManualNote = manualNotes.includes(pcsNoteKey);
                const isPcsLackInfo = lackInfoFlags.includes(pcsNoteKey);
                
                let isPcsFlagged = false;
                let pcsDiff = 0;

                if (isOffPcsValid) {
                    pcsDiff = (myTotal - offTotal).toFixed(2);
                    if (Math.abs(pcsDiff) > 4.5) isPcsFlagged = true;
                }

                if (isPcsFlagged || isPcsManualFlag || isPcsManualNote) {
                    if (isPcsFlagged) {
                        globalStats[comp].totalSystemFlags++;
                        if (isPcsLackInfo) globalStats[comp].lackInfoCount++;
                    }
                    
                    flaggedItemsByComp[comp].push({
                        skaterId: skaterId, skaterLabel: `#${stn} ${sData.skater}`,
                        type: 'PCS', id: 'TOTAL', nameHtml: 'Program Components (Sum)',
                        myEv: myTotal.toFixed(2), offMean: isOffPcsValid ? offTotal.toFixed(2) : '-',
                        diff: isOffPcsValid ? (pcsDiff > 0 ? `+${pcsDiff}` : pcsDiff) : '-',
                        noteKey: pcsNoteKey, existingNote: flagNotes[pcsNoteKey] || '',
                        isSystem: isPcsFlagged, 
                        isManualFlag: isPcsManualFlag, 
                        isManualNote: isPcsManualNote,
                        isLackInfo: isPcsLackInfo
                    });
                }
            });

            globalDataByComp = flaggedItemsByComp;
            isDataLoaded = true;

            // 處理廣播時差
            if (pendingComp) {
                selectComp(pendingComp);
                pendingComp = null;
            } else if (currentActiveComp) {
                selectComp(currentActiveComp);
            } else {
                document.getElementById('flagged-list').innerHTML = '<div class="bg-white p-8 rounded-xl shadow border border-slate-200 text-center text-slate-500 font-medium text-lg max-w-2xl mx-auto mt-10">👆 請從左上方「Global Event Select」選擇一場賽事</div>';
            }

        } catch (e) {
            console.error("載入失敗", e);
            document.getElementById('flagged-list').innerHTML = '<div class="p-8 text-center text-red-500 font-bold">讀取資料失敗，請確認網路連線。</div>';
        }
    }

    function recalcStatsLocal() {
        for(const comp in globalStats) {
            globalStats[comp].totalSystemFlags = 0;
            globalStats[comp].lackInfoCount = 0;
            
            const items = globalDataByComp[comp];
            if(!items) continue;

            items.forEach(item => {
                if (item.isSystem) {
                    globalStats[comp].totalSystemFlags++;
                    if (globalSkaterUpdates[item.skaterId].lack_info_flags.includes(item.noteKey)) {
                        globalStats[comp].lackInfoCount++;
                    }
                }
            });
        }
        renderStatsModal();
    }

    window.selectComp = function(comp) {
        currentActiveComp = comp;
        document.getElementById('current-comp-title').innerText = comp;
        document.getElementById('btn-add-manual').classList.remove('hidden');
        renderFlaggedList();
    }

    function renderFlaggedList() {
        const container = document.getElementById('flagged-list');
        container.innerHTML = '';
        
        const items = globalDataByComp[currentActiveComp] || [];

        if (items.length === 0) {
            container.innerHTML = `
                <div class="bg-white p-12 rounded-xl shadow-sm border border-slate-200 text-center flex flex-col items-center justify-center mt-4">
                    <span class="text-5xl mb-4">🎉</span>
                    <h3 class="text-xl font-bold text-slate-700 mb-1">本場賽事無異常項目</h3>
                    <p class="text-slate-500 mb-6">所有的評分都與官方高度一致。</p>
                </div>
            `;
            return;
        }

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col lg:flex-row gap-6';
            
            const badgeColor = item.type === 'TES' ? 'bg-indigo-100 text-indigo-700 border-indigo-200' : 'bg-purple-100 text-purple-700 border-purple-200';
            
            let statusBadge = '';
            if (item.isSystem) {
                if (item.isManualFlag) statusBadge = `<span class="text-xs bg-red-600 text-white px-2 py-0.5 rounded shadow-sm">🚨 系統異常 + 📌 釘選 Flag</span>`;
                else statusBadge = `<span class="text-xs bg-red-100 text-red-700 border border-red-200 px-2 py-0.5 rounded shadow-sm">🚨 系統異常</span>`;
            } else {
                if (item.isManualFlag) statusBadge = `<span class="text-xs bg-slate-700 text-white px-2 py-0.5 rounded shadow-sm">📌 自訂 Flag</span>`;
                else if (item.isManualNote) statusBadge = `<span class="text-xs bg-blue-100 text-blue-700 border border-blue-200 px-2 py-0.5 rounded shadow-sm">📝 純筆記 (Note)</span>`;
            }

            card.innerHTML = `
                <div class="lg:w-1/3 flex flex-col shrink-0 border-b lg:border-b-0 lg:border-r border-slate-100 pb-4 lg:pb-0 lg:pr-6">
                    <div class="text-sm font-bold text-slate-500 mb-1">${item.skaterLabel}</div>
                    <div class="flex items-center flex-wrap gap-2 mb-4">
                        <span class="text-xs font-bold px-2 py-1 rounded border ${badgeColor}">${item.type} #${item.id}</span>
                        <span class="text-xl font-black text-slate-800">${item.nameHtml}</span>
                        ${statusBadge}
                    </div>
                    
                    <div class="flex gap-4 text-sm bg-slate-50 p-3 rounded-lg border border-slate-200 inline-flex">
                        <div class="flex flex-col"><span class="text-[10px] text-slate-400 font-bold uppercase">My EV</span><span class="font-bold text-slate-700 text-base">${item.myEv}</span></div>
                        <div class="w-px bg-slate-200"></div>
                        <div class="flex flex-col"><span class="text-[10px] text-slate-400 font-bold uppercase">Off. Mean</span><span class="font-bold text-green-700 text-base">${item.offMean}</span></div>
                        <div class="w-px bg-slate-200"></div>
                        <div class="flex flex-col"><span class="text-[10px] text-slate-400 font-bold uppercase">Diff</span><span class="font-black text-lg ${item.isSystem ? 'text-red-600' : 'text-slate-500'}">${item.diff}</span></div>
                    </div>
                </div>
                
                <div class="lg:w-2/3 flex flex-col pt-2 lg:pt-0">
                    <div class="flex justify-between items-center mb-2 flex-wrap gap-2">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wide flex items-center gap-2">
                            <span>📝 Note / Comment</span>
                            <span class="text-green-500 opacity-0 transition-opacity font-bold" id="saved-tick-${item.skaterId}-${item.noteKey}">✓ 已編輯，待儲存</span>
                        </label>
                        
                        <label class="flex items-center gap-2 cursor-pointer bg-amber-50 hover:bg-amber-100 px-3 py-1.5 rounded border border-amber-200 transition-colors shadow-sm">
                            <input type="checkbox" class="w-4 h-4 text-amber-600 rounded border-slate-300 focus:ring-amber-500 cursor-pointer"
                                ${item.isLackInfo ? 'checked' : ''}
                                onchange="handleLackInfoChange('${item.skaterId}', '${item.noteKey}', this.checked); document.getElementById('saved-tick-${item.skaterId}-${item.noteKey}').style.opacity = '1';">
                            <span class="text-xs font-bold text-amber-800">Lack of TP Info (免責)</span>
                        </label>
                    </div>
                    
                    <textarea 
                        id="note-input-${item.skaterId}-${item.noteKey}"
                        class="note-input flex-1 bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm focus:bg-white focus:border-red-400 focus:ring-4 focus:ring-red-400/10 outline-none transition-all" 
                        placeholder="在這裡寫下這個動作的檢討或備註..."
                        oninput="handleNoteChange('${item.skaterId}', '${item.noteKey}', this.value); document.getElementById('saved-tick-${item.skaterId}-${item.noteKey}').style.opacity = '1';"
                    >${item.existingNote}</textarea>
                </div>
            `;
            container.appendChild(card);
        });
    }

    window.openStatsModal = function() { 
        recalcStatsLocal(); 
        document.getElementById('stats-modal').classList.remove('hidden'); 
    }
    
    function renderStatsModal() {
        const tbody = document.getElementById('stats-tbody');
        tbody.innerHTML = '';
        for(const comp in globalStats) {
            const data = globalStats[comp];
            
            let acceptableErrors = 1;
            if (data.skaters <= 10) acceptableErrors = 1;
            else if (data.skaters <= 20) acceptableErrors = 2;
            else if (data.skaters <= 30) acceptableErrors = 3;
            else if (data.skaters <= 40) acceptableErrors = 4;
            else if (data.skaters > 40) acceptableErrors = 5;

            const effectiveFlags = data.totalSystemFlags - data.lackInfoCount;

            let statusHtml = '<span class="text-green-600 font-bold">🟢 正常 (Normal)</span>';
            let effectiveTextClass = 'text-green-700';

            if (effectiveFlags > acceptableErrors) {
                statusHtml = '<span class="text-yellow-600 font-bold">🟡 注意 (!) 評分超標</span>';
                effectiveTextClass = 'text-red-600 font-bold';
            }

            tbody.innerHTML += `<tr>
                <td class="p-3 border text-left font-bold text-slate-700">${comp}</td>
                <td class="p-3 border">${data.skaters}</td>
                <td class="p-3 border text-slate-500">${data.totalSystemFlags}</td>
                <td class="p-3 border text-amber-700 font-bold bg-amber-50">-${data.lackInfoCount}</td>
                <td class="p-3 border ${effectiveTextClass} text-lg">${effectiveFlags}</td>
                <td class="p-3 border font-black text-blue-700 bg-blue-50">${acceptableErrors}</td>
                <td class="p-3 border">${statusHtml}</td>
            </tr>`;
        }
    }

    window.openManualModal = function() {
        if (!currentActiveComp) { alert("請先從上方選擇一場賽事！"); return; }
        document.getElementById('manual-comp-display').innerText = `目前賽事：${currentActiveComp}`;
        
        const skSelect = document.getElementById('manual-skater-select');
        skSelect.innerHTML = '<option value="">-- 請選擇選手 --</option>';
        rawSkatersData.filter(s => s.competition === currentActiveComp)
                      .sort((a, b) => (parseInt(a.stn) || 999) - (parseInt(b.stn) || 999))
                      .forEach(s => { skSelect.innerHTML += `<option value="${s.id}">#${s.stn} ${s.skater}</option>`; });
        
        document.getElementById('manual-item-select').innerHTML = '<option value="">-- 請先選擇選手 --</option>';
        document.getElementById('manual-modal').classList.remove('hidden');
    }

    window.closeManualModal = function() { document.getElementById('manual-modal').classList.add('hidden'); }

    window.updateManualItemSelect = function() {
        const skaterId = document.getElementById('manual-skater-select').value;
        const itemSelect = document.getElementById('manual-item-select');
        itemSelect.innerHTML = '<option value="">-- 選擇要釘選的動作/項目 --</option>';
        if(!skaterId) return;

        const skater = rawSkatersData.find(s => s.id === skaterId);
        (skater.elements || []).forEach((el, idx) => {
            if(el.name) itemSelect.innerHTML += `<option value="elem_${idx}">TES #${el.id || idx+1} : ${el.name}</option>`;
        });
        itemSelect.innerHTML += `<option value="pcs_total">PCS : Program Components (總和)</option>`;
    }

    window.addManualFlag = async function() {
        const skaterId = document.getElementById('manual-skater-select').value;
        const noteKey = document.getElementById('manual-item-select').value;
        const manualType = document.querySelector('input[name="manual_type"]:checked').value;
        
        if (!skaterId || !noteKey) { alert("請完整選擇選手與項目！"); return; }

        try {
            const targetField = manualType === 'flag' ? 'manual_flags' : 'manual_notes';
            await setDoc(doc(db, "scores", skaterId), { [targetField]: arrayUnion(noteKey) }, { merge: true });
            
            alert(`📌 成功加入自訂項目！(${manualType.toUpperCase()})`);
            closeManualModal();
            loadFlaggedData(); 
        } catch (e) { alert("加入失敗！"); }
    }

    window.saveAllNotes = async function() {
        const idsToSave = Object.keys(globalSkaterUpdates).filter(id => globalSkaterUpdates[id].isModified);
        if (idsToSave.length === 0) { alert("目前沒有修改任何內容。"); return; }

        const btn = document.querySelector('button[onclick="saveAllNotes()"]');
        const originalText = btn.innerHTML;
        btn.innerHTML = '⏳ 儲存中...'; btn.disabled = true;

        try {
            const updatePromises = idsToSave.map(id => {
                return setDoc(doc(db, "scores", id), { 
                    flag_notes: globalSkaterUpdates[id].flag_notes,
                    lack_info_flags: globalSkaterUpdates[id].lack_info_flags 
                }, { merge: true });
            });
            await Promise.all(updatePromises);
            
            idsToSave.forEach(id => globalSkaterUpdates[id].isModified = false);
            
            alert('✅ 所有註解與免責選項已成功儲存至雲端！');
            document.querySelectorAll('[id^="saved-tick-"]').forEach(el => el.style.opacity = '0');
        } catch (e) { alert('儲存失敗！'); } finally {
            btn.innerHTML = originalText; btn.disabled = false;
        }
    }

    // 頁面載入時就在背景先抓取資料
    window.onload = loadFlaggedData;
</script>
</body>
</html>
