<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>OAC 分析報告 (PDF Report)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; background-color: #f1f5f9; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    
    .report-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; background: white; margin-bottom: 1.5rem; table-layout: fixed; }
    .report-table th, .report-table td { border: 1px solid #cbd5e1; padding: 6px 4px; overflow: hidden; word-wrap: break-word; }
    .report-table th { background-color: #f8fafc; font-weight: 700; color: #1e293b; }
    .report-table .text-left { text-align: left; padding-left: 12px; }
    
    .col-my { background-color: #eff6ff; color: #1d4ed8; font-weight: 900; }
    .col-diff { font-weight: 900; }
    .diff-warn { color: #dc2626; }
    .diff-safe { color: #16a34a; }
    
    .pcs-crit td { font-size: 12px; color: #475569; font-style: italic; background-color: #fafafa; }
    .pcs-crit .col-my { background-color: #f0fdf4; color: #15803d; font-style: normal; }

    .print-page { margin-bottom: 2rem; padding: 2rem; background: white; border: 1px solid #cbd5e1; border-radius: 0.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); width: 100%; }
    
    @media print {
      @page { margin: 1cm; } 
      html, body, #main-wrapper, #right-content-container, #report-container {
        background-color: white !important; margin: 0 !important; padding: 0 !important; height: auto !important; width: 100% !important; overflow: visible !important; display: block !important; position: static !important;
      }
      #top-toolbar { display: none !important; }
      
      .print-page { box-shadow: none !important; border: none !important; padding: 0 !important; margin: 0 !important; page-break-after: always !important; break-after: page !important; page-break-inside: auto !important; }
      .print-page:last-child { page-break-after: auto !important; break-after: auto !important; }
      
      .report-table { font-size: 11px !important; margin-bottom: 12px !important; }
      .report-table th, .report-table td { padding: 3px 4px !important; }
      .pcs-crit td { font-size: 10px !important; padding: 2px 4px !important; }
      
      .print-header-box { padding-bottom: 6px !important; margin-bottom: 12px !important; border-bottom-width: 2px !important; }
      .print-comp-name { font-size: 10px !important; margin-bottom: 2px !important; }
      .print-skater-name { font-size: 20px !important; margin-top: 0 !important; }
      .print-noc { font-size: 18px !important; }
      .print-section-title { font-size: 13px !important; padding: 4px !important; margin-bottom: 4px !important; border-left-width: 3px !important; }
    }
  </style>
</head>
<body class="p-4 lg:p-6 h-screen flex flex-col box-border">

  <div id="top-toolbar" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center mb-4 shrink-0 w-full">
      <h1 class="text-2xl font-black text-blue-800 flex items-center gap-2">
          <span>🖨️</span> OAC Batch Print (PDF)
      </h1>
      <button onclick="window.print()" class="bg-blue-600 text-white hover:bg-blue-700 px-6 py-2 rounded font-bold shadow transition-colors text-sm flex items-center gap-2">
          <span>📄</span> 列印所選賽事全體報告
      </button>
  </div>

  <div id="main-wrapper" class="flex-1 overflow-hidden w-full relative">
    <div id="right-content-container" class="w-full hide-scrollbar overflow-y-auto h-full pr-2">
      <!-- 新增：提示橫幅 -->
      <div id="print-banner" class="bg-white p-8 rounded-xl shadow border border-slate-200 text-center text-slate-500 font-medium text-lg max-w-2xl mx-auto mt-20">
        👆 請從左上方「Global Event Select」選擇一場賽事產生報表
      </div>
      <div id="report-container" class="w-full" style="display: none;"></div>
    </div>
  </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcTYwmWN6W9gEmnvO2QyS1y2tCgDUUAgU",
      authDomain: "project-6981083948742415857.firebaseapp.com",
      projectId: "project-6981083948742415857",
      storageBucket: "project-6981083948742415857.firebasestorage.app",
      messagingSenderId: "708190565768",
      appId: "1:708190565768:web:00658fdeff9cf79341763d",
      measurementId: "G-MHC2PZ27D8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const pcsCriteriaDict = {
      composition: ["Multidimensional use of space and design of movements", "Connections between and within elements", "Choreography reflecting musical phrase and form", "Pattern and ice coverage", "Unity"],
      presentation: ["Expressiveness & projection", "Variety and contrast of energy and of movements", "Musical sensitivity and timing", "Oneness and awareness of space"],
      skatingSkills: ["Variety of edges, steps, turns, movements and directions", "Clarity of edges, steps, turns, movements and body control", "Balance and glide", "Flow", "Power and speed", "Unison"]
    };

    let groupedByComp = {};
    let isDataLoaded = false;
    let pendingComp = null;

    function calcStats(arr) {
        if(!arr || arr.length === 0) return { low: null, high: null, mean: null };
        let sorted = [...arr].sort((a,b)=>a-b);
        let low = sorted[0];
        let high = sorted[sorted.length-1];
        let mean = arr.reduce((a,b)=>a+b, 0) / arr.length;
        return { low, high, mean };
    }

    function parseEvString(str) {
        if(!str) return [];
        return str.trim().split(/[\s,]+/).map(n => parseFloat(n)).filter(n => !isNaN(n));
    }

    async function loadAllData() {
        try {
            const querySnapshot = await getDocs(collection(db, "scores"));
            groupedByComp = {};
            querySnapshot.forEach((doc) => {
                const d = doc.data();
                const comp = d.competition || "Unknown";
                if (!groupedByComp[comp]) groupedByComp[comp] = [];
                groupedByComp[comp].push({ id: doc.id, ...d });
            });

            for (const comp in groupedByComp) {
                groupedByComp[comp].sort((a, b) => (parseInt(a.stn) || 999) - (parseInt(b.stn) || 999));
            }

            isDataLoaded = true;
            if (pendingComp) {
                renderBatchReports(groupedByComp[pendingComp] || []);
                pendingComp = null;
            }
        } catch (error) {
            console.error("載入失敗:", error);
        }
    }

    // 【新增】監聽來自 index.html 的跨網頁廣播
    window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'GLOBAL_COMP_SELECTED') {
            const selectedComp = event.data.comp;
            if (isDataLoaded) {
                renderBatchReports(groupedByComp[selectedComp] || []);
            } else {
                pendingComp = selectedComp;
                document.getElementById('print-banner').innerText = "資料準備列印中，請稍候...";
            }
        }
    });

    function renderBatchReports(skatersArray) {
        document.getElementById('print-banner').style.display = 'none';
        const container = document.getElementById('report-container');
        container.innerHTML = '';
        container.style.display = 'block';

        if(skatersArray.length === 0) {
            container.innerHTML = `<div class="text-center text-slate-500 font-bold p-10 bg-white rounded-xl shadow border">該賽事無報表資料</div>`;
            return;
        }

        skatersArray.forEach((data) => {
            let recordTimeStr = '---';
            if (data.timestamp) {
                const dateObj = new Date(data.timestamp);
                recordTimeStr = dateObj.toLocaleString('zh-TW', { hour12: false });
            }

            const manualFlags = Array.isArray(data.manual_flags) ? data.manual_flags : Object.values(data.manual_flags || {});
            const manualNotes = Array.isArray(data.manual_notes) ? data.manual_notes : Object.values(data.manual_notes || {});
            const lackInfoFlags = Array.isArray(data.lack_info_flags) ? data.lack_info_flags : Object.values(data.lack_info_flags || {});

            let tesHtml = '';
            (data.elements || []).forEach((el, idx) => {
                if (!el.name || el.name.trim() === '') return;

                let myGoe = el.goe !== null ? Math.round(parseFloat(el.goe)) : null;
                let offVals = parseEvString((data.official_stats && data.official_stats.elements && data.official_stats.elements[idx]) || '');
                let stats = calcStats(offVals);

                let diffHtml = '---';
                let isMathFlagged = false;
                
                if (myGoe !== null && stats.mean !== null) {
                    let diff = myGoe - stats.mean;
                    if (Math.abs(diff) > 2.00) isMathFlagged = true;
                    let diffClass = isMathFlagged ? 'diff-warn' : 'diff-safe';
                    diffHtml = `<span class="${diffClass}">${diff > 0 ? '+'+diff.toFixed(2) : diff.toFixed(2)}</span>`;
                }

                const elemKey = `elem_${idx}`;
                let hasLackInfo = lackInfoFlags.includes(elemKey);
                let isManualFlag = manualFlags.includes(elemKey);
                let isManualNote = manualNotes.includes(elemKey);
                let noteTxt = (data.flag_notes && data.flag_notes[elemKey]) ? data.flag_notes[elemKey] : '';
                
                let isFlagged = isMathFlagged || isManualFlag;
                let isNote = !isFlagged && (isManualNote || noteTxt.trim() !== '');

                let flagHtml = '';
                if (hasLackInfo) flagHtml += `<span class="bg-slate-700 text-white px-1.5 py-0.5 rounded font-bold text-[9px] uppercase whitespace-nowrap mb-1 inline-block">Lack of TP info</span>`;
                
                if (isFlagged) flagHtml += `<span class="bg-red-100 text-red-700 px-1 rounded font-bold mr-1" title="Flagged (異常標記)">🚩</span>`;
                else if (isNote) flagHtml += `<span class="bg-blue-100 text-blue-700 px-1 rounded font-bold mr-1" title="Note (個人筆記)">📝</span>`;

                tesHtml += `
                    <tr>
                        <td class="text-slate-500">${el.id || (idx+1)}</td>
                        <td class="text-left font-bold text-slate-800 break-words">${el.name}</td>
                        <td class="col-my">${myGoe !== null ? myGoe : '-'}</td>
                        <td>${stats.low !== null ? Math.round(stats.low) : '-'}</td>
                        <td>${stats.high !== null ? Math.round(stats.high) : '-'}</td>
                        <td class="font-bold text-blue-700">${stats.mean !== null ? stats.mean.toFixed(2) : '-'}</td>
                        <td class="col-diff bg-slate-50">${diffHtml}</td>
                        <td class="text-left text-xs leading-tight">
                            <div class="flex flex-col gap-1 items-start">
                                ${flagHtml ? `<div>${flagHtml}</div>` : ''}
                                ${noteTxt ? `<div class="text-slate-600 italic break-words w-full">${noteTxt}</div>` : ''}
                            </div>
                        </td>
                    </tr>
                `;
            });

            let pcsHtml = '';
            const pcsKeys = ['composition', 'presentation', 'skatingSkills'];
            const pcsLabels = ['Composition', 'Presentation', 'Skating Skills'];
            const pcsCriteriaData = data.pcs_criteria || {};
            const pcsNotesData = data.pcs_criteria_notes || {};
            
            let sumMyPcs = 0;
            let sumMeanPcs = 0;
            let validMeanCount = 0;
            let judgeScores = { composition: [], presentation: [], skatingSkills: [] };

            pcsKeys.forEach((key, idx) => {
                let myVal = parseFloat((data.pcs || {})[key] || 0);
                let offVals = parseEvString((data.official_stats && data.official_stats.pcs && data.official_stats.pcs[key]) || '');
                judgeScores[key] = offVals; 
                let stats = calcStats(offVals);

                if (myVal > 0) sumMyPcs += myVal;
                if (stats.mean !== null && !isNaN(stats.mean)) {
                    sumMeanPcs += stats.mean;
                    validMeanCount++;
                }

                let diffHtml = '---';
                if (myVal > 0 && stats.mean !== null) {
                    let diff = myVal - stats.mean;
                    let diffClass = Math.abs(diff) > 0.75 ? 'diff-warn' : 'diff-safe';
                    diffHtml = `<span class="${diffClass}">${diff > 0 ? '+'+diff.toFixed(2) : diff.toFixed(2)}</span>`;
                }

                pcsHtml += `
                    <tr class="border-t-2 border-slate-300 bg-slate-50">
                        <td class="text-left font-black text-slate-800 uppercase tracking-widest">${pcsLabels[idx]}</td>
                        <td class="col-my text-base">${myVal > 0 ? myVal.toFixed(2) : '-'}</td>
                        <td class="font-bold">${stats.low !== null ? stats.low.toFixed(2) : '-'}</td>
                        <td class="font-bold">${stats.high !== null ? stats.high.toFixed(2) : '-'}</td>
                        <td class="font-bold text-blue-700">${stats.mean !== null ? stats.mean.toFixed(2) : '-'}</td>
                        <td class="col-diff">${diffHtml}</td>
                    </tr>
                `;

                if (pcsCriteriaData[key]) {
                    pcsCriteriaDict[key].forEach((critText, critIndex) => {
                        let cVal = pcsCriteriaData[key][critIndex];
                        if (cVal && parseFloat(cVal) > 0) {
                            let cNote = (pcsNotesData[key] && pcsNotesData[key][critIndex]) ? pcsNotesData[key][critIndex] : '';
                            let noteDisplay = cNote.trim() !== '' ? `<span class="text-slate-800 font-bold not-italic break-words">${cNote}</span>` : '--';

                            pcsHtml += `
                                <tr class="pcs-crit">
                                    <td class="text-left pl-8 break-words">• ${critText}</td>
                                    <td class="col-my">${parseFloat(cVal).toFixed(2)}</td>
                                    <td colspan="4" class="text-slate-400 text-left pl-4">${noteDisplay}</td>
                                </tr>
                            `;
                        }
                    });
                }
            });

            let minJudgeTotal = null;
            let maxJudgeTotal = null;
            const cLen = judgeScores.composition.length;
            const pLen = judgeScores.presentation.length;
            const sLen = judgeScores.skatingSkills.length;
            
            if (cLen > 0 && cLen === pLen && pLen === sLen) {
                let totalsArray = [];
                for (let i = 0; i < cLen; i++) {
                    totalsArray.push(judgeScores.composition[i] + judgeScores.presentation[i] + judgeScores.skatingSkills[i]);
                }
                minJudgeTotal = Math.min(...totalsArray);
                maxJudgeTotal = Math.max(...totalsArray);
            }

            let totalDiffHtml = '---';
            if (validMeanCount === 3 && sumMyPcs > 0) {
                let totalDiff = sumMyPcs - sumMeanPcs;
                let isTotalPcsFlagged = Math.abs(totalDiff) > 4.50;
                const pcsNoteKey = 'pcs_total';
                let isManualFlagPcs = manualFlags.includes(pcsNoteKey);
                let isManualNotePcs = manualNotes.includes(pcsNoteKey);
                
                let isPcsFlagged = isTotalPcsFlagged || isManualFlagPcs;
                let isPcsNote = !isPcsFlagged && isManualNotePcs;
                
                let totalDiffClass = isPcsFlagged ? 'diff-warn text-base' : 'diff-safe text-base';
                let totalFlagIcon = '';
                
                if (isPcsFlagged) totalFlagIcon = `<span class="bg-red-100 text-red-700 px-1 rounded mr-1 font-bold">🚩</span>`;
                else if (isPcsNote) totalFlagIcon = `<span class="bg-blue-100 text-blue-700 px-1 rounded mr-1 font-bold">📝</span>`;
                
                totalDiffHtml = `${totalFlagIcon}<span class="${totalDiffClass}">${totalDiff > 0 ? '+'+totalDiff.toFixed(2) : totalDiff.toFixed(2)}</span>`;
            }

            pcsHtml += `
                <tr class="border-t-[4px] border-slate-700 bg-slate-200">
                    <td class="font-black text-slate-900 uppercase tracking-widest relative">
                        <span class="absolute left-2 bottom-1.5 text-[10px] text-slate-500 font-normal normal-case opacity-70">Saved: ${recordTimeStr}</span>
                        <div class="text-right pr-6 py-2">Total Score</div>
                    </td>
                    <td class="col-my text-base font-black py-2">${sumMyPcs > 0 ? sumMyPcs.toFixed(2) : '-'}</td>
                    <td class="font-black text-slate-700 py-2">${minJudgeTotal !== null ? minJudgeTotal.toFixed(2) : '-'}</td>
                    <td class="font-black text-slate-700 py-2">${maxJudgeTotal !== null ? maxJudgeTotal.toFixed(2) : '-'}</td>
                    <td class="font-black text-blue-900 text-base py-2">${validMeanCount === 3 ? sumMeanPcs.toFixed(2) : '-'}</td>
                    <td class="col-diff py-2">${totalDiffHtml}</td>
                </tr>
            `;

            const pageDiv = document.createElement('div');
            pageDiv.className = 'print-page';
            pageDiv.innerHTML = `
                <div class="flex justify-between items-end border-slate-800 print-header-box border-b-4 pb-2 mb-4">
                    <div>
                        <div class="text-sm font-bold text-slate-500 uppercase tracking-widest print-comp-name">${data.tier || 'Event'} | ${data.competition}</div>
                        <div class="text-3xl font-black text-slate-900 mt-1 print-skater-name">#${data.stn || '-'} ${data.skater}</div>
                    </div>
                    <div class="text-2xl font-black text-blue-700 print-noc">${data.noc || '---'}</div>
                </div>

                <h3 class="text-base font-black text-slate-800 mb-2 bg-slate-100 p-2 border-l-4 border-blue-600 print-section-title">Technical Elements (Integers)</h3>
                <table class="report-table">
                    <thead>
                        <tr>
                            <th width="4%">#</th><th width="20%" class="text-left">Element</th><th width="8%" class="col-my">X (My)</th>
                            <th width="8%">Low</th><th width="8%">High</th><th width="8%" class="text-blue-700">Mean</th><th width="10%">Diff (X-Mean)</th>
                            <th width="34%" class="text-left">Flag & Notes</th>
                        </tr>
                    </thead>
                    <tbody>${tesHtml}</tbody>
                </table>

                <h3 class="text-base font-black text-slate-800 mb-2 bg-slate-100 p-2 border-l-4 border-indigo-600 print-section-title mt-4">Program Components (Decimals)</h3>
                <table class="report-table">
                    <thead>
                        <tr>
                            <th width="44%" class="text-left">Component / Criteria</th><th width="10%" class="col-my">X (My)</th>
                            <th width="10%">Low</th><th width="10%">High</th><th width="10%" class="text-blue-700">Mean</th><th width="16%">Diff (X-Mean)</th>
                        </tr>
                    </thead>
                    <tbody>${pcsHtml}</tbody>
                </table>
            `;
            container.appendChild(pageDiv);
        });
    }

    window.onload = loadAllData;
</script>
</body>
</html>
