<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>ISU OAC 裁判分析系統 (PCS Analysis)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .oac-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
    .oac-table th, .oac-table td { border: 1px solid #cbd5e1; padding: 6px; }
    .oac-table th { background-color: #e2e8f0; color: #334155; font-weight: 800; }
    .oac-table .text-left { text-align: left; }
    .alert-red { background-color: #fecaca !important; color: #991b1b; font-weight: bold; }
    .alert-green { background-color: #bbf7d0 !important; color: #166534; font-weight: bold; }
    .section-title { font-size: 1.25rem; font-weight: 800; color: #1e3a8a; border-left: 5px solid #3b82f6; padding-left: 10px; margin-bottom: 1rem; text-transform: uppercase;}
  </style>
</head>
<body class="p-6 h-screen flex flex-col box-border relative">

  <h1 class="text-3xl font-black text-center text-blue-900 mb-6 uppercase tracking-wider shrink-0">
      PCS Judge Analysis (OAC)
  </h1>

  <div class="flex-1 overflow-hidden w-full relative flex flex-col">
    
    <div id="intro-banner" class="bg-white p-8 rounded-xl shadow border border-slate-200 text-center text-slate-500 font-medium text-lg max-w-2xl mx-auto mt-10">
        👆 請從左上方「Global Event Select」選擇一場賽事進行 OAC 深度分析
    </div>

    <!-- 右側主內容：分析報表 -->
    <div id="analysis-container" class="w-full flex-1 flex flex-col gap-8 hide-scrollbar overflow-y-auto pb-20 hidden px-2">
      
      <div id="no-data-banner" class="hidden bg-white p-10 rounded-xl shadow border border-slate-200 text-center text-slate-500 font-bold text-lg">
          該賽事目前無選手資料可供分析。
      </div>

      <div id="reports-wrapper" class="flex flex-col gap-8 w-full">
          <!-- Report 1: Variance by each judge (三項差值) -->
          <div class="bg-white p-6 rounded-xl shadow-lg w-full">
              <h2 class="section-title">Variance of the 3 PC marks of each skater</h2>
              <p class="text-sm text-slate-500 mb-4">分析裁判對同一位選手的「三項分數差 (Max - Min)」。若差值 ≤ 0.25，將標記為紅色 (警示未拉開分數/Halo Effect)；差值 ≥ 1.00，標記為綠色。</p>
              <div class="overflow-x-auto">
                  <table class="oac-table" id="variance-table">
                      <!-- JS 生成 -->
                  </table>
              </div>
          </div>

          <!-- Report 2~5: Matrix & Range (給分次數矩陣與統計) -->
          <div id="matrices-container" class="flex flex-col gap-8 w-full">
              <!-- JS 生成 4 個獨立區塊 -->
          </div>
      </div>
    </div>
  </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcTYwmWN6W9gEmnvO2QyS1y2tCgDUUAgU",
      authDomain: "project-6981083948742415857.firebaseapp.com",
      projectId: "project-6981083948742415857",
      storageBucket: "project-6981083948742415857.firebasestorage.app",
      messagingSenderId: "708190565768",
      appId: "1:708190565768:web:00658fdeff9cf79341763d",
      measurementId: "G-MHC2PZ27D8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allScoresData = []; 
    let isDataLoaded = false;
    let pendingComp = null;

    function parseJudgeStr(str) {
        if(!str) return [];
        return str.trim().split(/[\s\t,]+/).map(n => parseFloat(n)).filter(n => !isNaN(n));
    }

    async function loadData() {
        try {
            const querySnapshot = await getDocs(collection(db, "scores"));
            allScoresData = [];
            querySnapshot.forEach((doc) => {
                allScoresData.push(doc.data());
            });

            isDataLoaded = true;
            
            if (pendingComp) {
                analyzeCompetition(pendingComp);
                pendingComp = null;
            }
        } catch (e) { 
            console.error(e); 
            document.getElementById('intro-banner').innerText = "資料載入失敗，請檢查網路連線。";
        }
    }

    window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'GLOBAL_COMP_SELECTED') {
            const selectedComp = event.data.comp;
            if (isDataLoaded) {
                analyzeCompetition(selectedComp);
            } else {
                pendingComp = selectedComp;
                document.getElementById('intro-banner').innerText = "資料載入中，請稍候...";
            }
        }
    });

    function analyzeCompetition(compName) {
        document.getElementById('intro-banner').style.display = 'none';
        document.getElementById('analysis-container').classList.remove('hidden');

        const skaters = allScoresData
            .filter(d => d.competition === compName)
            .sort((a, b) => (parseInt(a.stn) || 999) - (parseInt(b.stn) || 999));

        if (skaters.length === 0) {
            document.getElementById('no-data-banner').classList.remove('hidden');
            document.getElementById('reports-wrapper').classList.add('hidden');
            return;
        } else {
            document.getElementById('no-data-banner').classList.add('hidden');
            document.getElementById('reports-wrapper').classList.remove('hidden');
        }

        let numOfJudges = 0;
        skaters.forEach(s => {
            const off = s.official_stats?.pcs || {};
            numOfJudges = Math.max(numOfJudges, parseJudgeStr(off.composition).length, parseJudgeStr(off.presentation).length, parseJudgeStr(off.skatingSkills).length);
        });

        let judgesData = [{ name: 'X', allMarks: [], compMarks: [], presMarks: [], skillsMarks: [], skaterDiffs: [] }];
        for(let j = 0; j < numOfJudges; j++) {
            judgesData.push({ name: `J${j+1}`, allMarks: [], compMarks: [], presMarks: [], skillsMarks: [], skaterDiffs: [] });
        }

        skaters.forEach(s => {
            const xCo = parseFloat((s.pcs || {}).composition || 0);
            const xPr = parseFloat((s.pcs || {}).presentation || 0);
            const xSk = parseFloat((s.pcs || {}).skatingSkills || 0);
            
            const xMarks = [];
            if (xCo > 0) { judgesData[0].compMarks.push(xCo); judgesData[0].allMarks.push(xCo); xMarks.push(xCo); }
            if (xPr > 0) { judgesData[0].presMarks.push(xPr); judgesData[0].allMarks.push(xPr); xMarks.push(xPr); }
            if (xSk > 0) { judgesData[0].skillsMarks.push(xSk); judgesData[0].allMarks.push(xSk); xMarks.push(xSk); }
            
            if (xMarks.length === 3) {
                const max = Math.max(...xMarks);
                const min = Math.min(...xMarks);
                judgesData[0].skaterDiffs.push({ label: `#${s.stn || '-'} ${s.skater.substring(0, 8)}`, min: min, max: max, diff: max - min });
            }

            const off = s.official_stats?.pcs || {};
            const coArr = parseJudgeStr(off.composition);
            const prArr = parseJudgeStr(off.presentation);
            const skArr = parseJudgeStr(off.skatingSkills);

            for (let j = 0; j < numOfJudges; j++) {
                const co = coArr[j];
                const pr = prArr[j];
                const sk = skArr[j];
                const skaterMarks = [];
                const targetJudge = judgesData[j + 1];

                if (co !== undefined) { targetJudge.compMarks.push(co); targetJudge.allMarks.push(co); skaterMarks.push(co); }
                if (pr !== undefined) { targetJudge.presMarks.push(pr); targetJudge.allMarks.push(pr); skaterMarks.push(pr); }
                if (sk !== undefined) { targetJudge.skillsMarks.push(sk); targetJudge.allMarks.push(sk); skaterMarks.push(sk); }

                if (skaterMarks.length === 3) {
                    const max = Math.max(...skaterMarks);
                    const min = Math.min(...skaterMarks);
                    targetJudge.skaterDiffs.push({ label: `#${s.stn || '-'} ${s.skater.substring(0, 8)}`, min: min, max: max, diff: max - min });
                }
            }
        });

        renderVarianceTable(judgesData);
        renderMatrixTables(judgesData);
    }

    function renderVarianceTable(judgesData) {
        const tbody = document.getElementById('variance-table');
        let html = `<thead><tr><th width="15%" class="text-left">Skater</th>`;
        judgesData.forEach(j => html += `<th>${j.name}</th>`);
        html += `</tr></thead><tbody>`;

        if (judgesData[0] && judgesData[0].skaterDiffs.length > 0) {
            const skaterCount = judgesData[0].skaterDiffs.length;
            for(let i=0; i<skaterCount; i++) {
                html += `<tr><td class="text-left font-bold bg-slate-50">${judgesData[0].skaterDiffs[i].label}</td>`;
                judgesData.forEach(judge => {
                    const diffObj = judge.skaterDiffs[i];
                    if(!diffObj) { html += `<td>-</td>`; return; }
                    const diffVal = diffObj.diff;
                    let colorClass = '';
                    if (diffVal <= 0.25) colorClass = 'alert-red'; 
                    else if (diffVal >= 1.00) colorClass = 'alert-green'; 
                    html += `<td class="${colorClass}">${diffVal.toFixed(2)}</td>`;
                });
                html += `</tr>`;
            }
        }
        html += `</tbody>`;
        tbody.innerHTML = html;
    }

    // 整合後的 Matrix 與 Range 卡片生成器
    function renderMatrixTables(judgesData) {
        const container = document.getElementById('matrices-container');
        let html = '';

        const sections = [
            { label: 'Composition', key: 'compMarks', rangeThreshold: 1.0 },
            { label: 'Presentation', key: 'presMarks', rangeThreshold: 1.0 },
            { label: 'Skating Skills', key: 'skillsMarks', rangeThreshold: 1.0 },
            { label: 'Total Segment (All PCs)', key: 'allMarks', rangeThreshold: 1.50 }
        ];

        sections.forEach(section => {
            html += `<div class="bg-white p-6 rounded-xl shadow-lg w-full">
                <h2 class="section-title">${section.label}</h2>
                <div class="overflow-x-auto">
                    <table class="oac-table w-full">
                        <thead>
                            <tr>
                                <th class="text-left" width="10%">Mark</th>`;
            
            judgesData.forEach(j => html += `<th>${j.name}</th>`);
            html += `</tr></thead><tbody>`;

            let allUsedMarks = [];
            judgesData.forEach(j => allUsedMarks.push(...j[section.key]));
            
            if (allUsedMarks.length === 0) {
                html += `<tr><td colspan="${judgesData.length + 1}">No Data</td></tr></tbody></table></div></div>`;
                return;
            }
            
            const overallMax = Math.max(...allUsedMarks);
            const overallMin = Math.min(...allUsedMarks);

            // 1. 矩陣主體
            for (let m = overallMax; m >= overallMin; m -= 0.25) {
                let hasAny = false;
                let rowHtml = `<tr><td class="font-bold bg-slate-50 border-r-2 border-slate-300">${m.toFixed(2)}</td>`;
                
                judgesData.forEach(judge => {
                    const count = judge[section.key].filter(val => val === m).length;
                    if (count > 0) hasAny = true;
                    rowHtml += `<td>${count > 0 ? count : ''}</td>`;
                });
                rowHtml += `</tr>`;
                if (hasAny) html += rowHtml;
            }

            // 2. 底部統計區塊
            // Max
            html += `<tr class="bg-slate-100 border-t-4 border-slate-400">
                <td class="font-bold text-slate-700 text-left border-r-2 border-slate-300">Max</td>`;
            judgesData.forEach(judge => {
                const marks = judge[section.key];
                html += `<td>${marks.length > 0 ? Math.max(...marks).toFixed(2) : '-'}</td>`;
            });
            html += `</tr>`;

            // Min
            html += `<tr class="bg-slate-100">
                <td class="font-bold text-slate-700 text-left border-r-2 border-slate-300">Min</td>`;
            judgesData.forEach(judge => {
                const marks = judge[section.key];
                html += `<td>${marks.length > 0 ? Math.min(...marks).toFixed(2) : '-'}</td>`;
            });
            html += `</tr>`;

            // Range (含警示邏輯)
            html += `<tr class="bg-slate-100">
                <td class="font-bold text-slate-700 text-left border-r-2 border-slate-300">Range</td>`;
            judgesData.forEach(judge => {
                const marks = judge[section.key];
                if(marks.length > 0) {
                    const diff = Math.max(...marks) - Math.min(...marks);
                    const isRed = diff <= section.rangeThreshold;
                    html += `<td class="font-bold ${isRed ? 'alert-red' : 'text-blue-800'}">${diff.toFixed(2)}</td>`;
                } else {
                    html += `<td>-</td>`;
                }
            });
            html += `</tr>`;

            // Distinct Marks
            html += `<tr class="bg-yellow-50 font-bold border-t-2 border-slate-300">
                <td class="text-left text-slate-700 border-r-2 border-slate-300">Distinct Marks</td>`;
            judgesData.forEach(judge => {
                const distinctCount = new Set(judge[section.key]).size;
                html += `<td class="text-blue-700 text-lg">${distinctCount > 0 ? distinctCount : '-'}</td>`;
            });
            html += `</tr>`;

            html += `</tbody></table></div></div>`;
        });

        container.innerHTML = html;
    }

    // 啟動載入
    window.onload = loadData;
</script>
</body>
</html>
